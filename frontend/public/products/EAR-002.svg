<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg20" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f8f8"/>
      <stop offset="100%" style="stop-color:#f0f0f0"/>
    </linearGradient>
    <filter id="shadow20" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg20)"/>
  
  <!-- Wired Earbuds Basic -->
  <g transform="translate(200, 150)" filter="url(#shadow20)">
    <!-- Cable -->
    <g fill="none" stroke="#333" stroke-width="3" opacity="0.3">
      <path d="M 0 0 Q -30 -30 -60 -30 Q -90 -30 -90 0 Q -90 30 -60 30 Q 0 30 0 0 Q 30 30 60 30 Q 90 30 90 0 Q 90 -30 60 -30 Q 60 -30 30 -30 Q 30 -30 0 0"/>
    </g>
    
    <!-- Earbuds -->
    <g fill="#1a1a1a">
      <!-- Left earbud -->
      <ellipse cx="-50" cy="0" rx="15" ry="10"/>
      <ellipse cx="-50" cy="0" rx="11" ry="6" fill="#0f0f0f"/>
      <circle cx="-50" cy="0" r="3" fill="#444"/>
      
      <!-- Right earbud -->
      <ellipse cx="50" cy="0" rx="15" ry="10"/>
      <ellipse cx="50" cy="0" rx="11" ry="6" fill="#0f0f0f"/>
      <circle cx="50" cy="0" r="3" fill="#444"/>
    </g>
    
    <!-- In-line microphone -->
    <rect x="-5" y="30" width="10" height="20" rx="3" fill="#1a1a1a"/>
    <circle cx="0" cy="42" r="2" fill="#444"/>
    
    <!-- 3.5mm jack -->
    <rect x="-5" y="-80" width="10" height="25" rx="2" fill="#1a1a1a"/>
    <rect x="-3" y="-78" width="6" height="20" rx="1" fill="#0f0f0f"/>
    <circle cx="0" cy="-65" r="2" fill="#444"/>
    
    <!-- Cable texture -->
    <path d="M 0 0 Q -30 -30 -60 -30 Q -90 -30 -90 0 Q -90 30 -60 30 Q 0 30 0 0 Q 30 30 60 30 Q 90 30 90 0 Q 90 -30 60 -30 Q 60 -30 30 -30 Q 30 -30 0 0" 
          stroke="#555" stroke-width="1" fill="none" stroke-dasharray="4,4" opacity="0.3"/>
  </g>
  
  <text x="380" y="285" font-family="system-ui, sans-serif" font-size="10" fill="#aaa" text-anchor="end" opacity="0.3">Meridian</text>
</svg>
<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg22" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f0f8"/>
      <stop offset="100%" style="stop-color:#e0e0f0"/>
    </linearGradient>
    <filter id="shadow22" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg22)"/>
  
  <!-- USB Desk Microphone -->
  <g transform="translate(200, 150)" filter="url(#shadow22)">
    <!-- Microphone body -->
    <ellipse cx="0" cy="-30" rx="25" ry="35" fill="#1a1a1a"/>
    <ellipse cx="0" cy="-30" rx="20" ry="30" fill="#0f0f0f"/>
    
    <!-- Capsule/grille -->
    <ellipse cx="0" cy="-30" rx="15" ry="15" fill="#1a1a1a"/>
    <g fill="#333">
      <circle cx="0" cy="-30" r="12"/>
      <g stroke="#333" stroke-width="0.5" opacity="0.4">
        <line x1="-10" y1="-30" x2="10" y2="-30"/>
        <line x1="0" y1="-40" x2="0" y2="-20"/>
      </g>
    </g>
    
    <!-- Shock mount -->
    <ellipse cx="0" cy="-65" rx="30" ry="8" fill="#1a1a1a"/>
    <ellipse cx="0" cy="-65" rx="25" ry="5" fill="#0f0f0f"/>
    <ellipse cx="0" cy="-65" rx="20" ry="3" fill="#333" opacity="0.5"/>
    
    <!-- Stand/boom arm -->
    <path d="M 0 -70 Q 40 -100 80 -120" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="80" cy="-120" r="10" fill="#2a2a2a"/>
    <circle cx="80" cy="-120" r="6" fill="#1a1a1a"/>
    
    <!-- XLR connector -->
    <ellipse cx="80" cy="-135" rx="12" ry="6" fill="#1a1a1a"/>
    <ellipse cx="80" cy="-135" rx="8" ry="3" fill="#0f0f0f"/>
    <circle cx="80" cy="-135" r="2" fill="#FFAC1C" opacity="0.8">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Pop filter -->
    <ellipse cx="0" cy="-40" rx="35" ry="25" fill="none" stroke="#333" stroke-width="2" opacity="0.5"/>
    <ellipse cx="0" cy="-40" rx="30" ry="20" fill="#1a1a1a" opacity="0.3"/>
  </g>
  
  <text x="380" y="285" font-family="system-ui, sans-serif" font-size="10" fill="#aaa" text-anchor="end" opacity="0.3">Meridian</text>
</svg>
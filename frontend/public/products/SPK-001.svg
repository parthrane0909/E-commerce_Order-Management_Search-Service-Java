<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg23" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f0f0"/>
      <stop offset="100%" style="stop-color:#e8e8e8"/>
    </linearGradient>
    <filter id="shadow23" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg23)"/>
  
  <!-- Studio Monitor Speakers (pair) -->
  <g transform="translate(200, 150)" filter="url(#shadow24)">
    <!-- Left speaker -->
    <g transform="translate(-90, 0)">
      <rect x="-60" y="-90" width="120" height="180" rx="8" fill="#1a1a1a"/>
      <rect x="-55" y="-85" width="110" height="170" rx="6" fill="#0f0f0f"/>
      
      <!-- Woofer -->
      <circle cx="0" cy="40" r="35" fill="#1a1a1a"/>
      <circle cx="0" cy="40" r="30" fill="#0f0f0f"/>
      <circle cx="0" cy="40" r="25" fill="#1a1a1a"/>
      <circle cx="0" cy="40" r="15" fill="#0f0f0f"/>
      <circle cx="0" cy="40" r="8" fill="#333"/>
      
      <!-- Tweeter -->
      <circle cx="0" cy="-40" r="18" fill="#1a1a1a"/>
      <circle cx="0" cy="-40" r="14" fill="#0f0f0f"/>
      <circle cx="0" cy="-40" r="8" fill="#1a1a1a"/>
      <circle cx="0" cy="-40" r="4" fill="#333"/>
      
      <!-- Port -->
      <ellipse cx="0" cy="85" rx="12" ry="4" fill="#1a1a1a"/>
      <ellipse cx="0" cy="85" rx="8" ry="2" fill="#0f0f0f"/>
    </g>
    
    <!-- Right speaker -->
    <g transform="translate(180, 0)">
      <rect x="-60" y="-90" width="120" height="180" rx="8" fill="#1a1a1a"/>
      <rect x="-55" y="-85" width="110" height="170" rx="6" fill="#0f0f0f"/>
      
      <circle cx="0" cy="40" r="35" fill="#1a1a1a"/>
      <circle cx="0" cy="40" r="30" fill="#0f0f0f"/>
      <circle cx="0" cy="40" r="25" fill="#1a1a1a"/>
      <circle cx="0" cy="40" r="15" fill="#0f0f0f"/>
      <circle cx="0" cy="40" r="8" fill="#333"/>
      
      <circle cx="0" cy="-40" r="18" fill="#1a1a1a"/>
      <circle cx="0" cy="-40" r="14" fill="#0f0f0f"/>
      <circle cx="0" cy="-40" r="8" fill="#1a1a1a"/>
      <circle cx="0" cy="-40" r="4" fill="#333"/>
      
      <ellipse cx="0" cy="85" rx="12" ry="4" fill="#1a1a1a"/>
      <ellipse cx="0" cy="85" rx="8" ry="2" fill="#0f0f0f"/>
    </g>
    
    <!-- Power indicator -->
    <circle cx="-70" cy="-100" r="4" fill="#FFAC1C" opacity="0.8">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Volume knob -->
    <circle cx="70" cy="-100" r="10" fill="#2a2a2a"/>
    <circle cx="70" cy="-100" r="6" fill="#1a1a1a"/>
    <circle cx="70" cy="-100" r="2" fill="#FFAC1C" opacity="0.6">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <text x="380" y="285" font-family="system-ui, sans-serif" font-size="10" fill="#aaa" text-anchor="end" opacity="0.3">Meridian</text>
</svg>
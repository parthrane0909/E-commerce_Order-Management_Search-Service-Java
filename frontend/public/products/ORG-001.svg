<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f0e8"/>
      <stop offset="100%" style="stop-color:#e8e0d4"/>
    </linearGradient>
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg1)"/>
  
  <!-- Desk Organizer - Bamboo style -->
  <g transform="translate(200, 150)" filter="url(#shadow1)">
    <!-- Main body -->
    <rect x="-80" y="-40" width="160" height="80" rx="8" fill="#d4b896"/>
    <rect x="-75" y="-35" width="150" height="70" rx="6" fill="#c4a886"/>
    
    <!-- Compartments -->
    <rect x="-70" y="-30" width="45" height="55" rx="4" fill="#b89876" opacity="0.6"/>
    <rect x="-20" y="-30" width="45" height="55" rx="4" fill="#b89876" opacity="0.6"/>
    <rect x="30" y="-30" width="45" height="55" rx="4" fill="#b89876" opacity="0.6"/>
    
    <!-- Phone slot -->
    <rect x="85" y="-35" width="30" height="60" rx="4" fill="#a88866" opacity="0.5"/>
    
    <!-- Wood grain lines -->
    <g stroke="#a88866" stroke-width="0.5" opacity="0.3">
      <line x1="-75" y1="-20" x2="75" y2="-20"/>
      <line x1="-75" y1="0" x2="75" y2="0"/>
      <line x1="-75" y1="20" x2="75" y2="20"/>
    </g>
  </g>
  
  <!-- Subtle brand mark -->
  <text x="380" y="285" font-family="system-ui, sans-serif" font-size="10" fill="#aaa" text-anchor="end" opacity="0.3">Meridian</text>
</svg>
<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f0e8"/>
      <stop offset="100%" style="stop-color:#e8e0d4"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg2)"/>
  
  <!-- Notebook Set -->
  <g transform="translate(200, 150)" filter="url(#shadow2)">
    <!-- Stack of 3 notebooks -->
    <g fill="#2c3e50">
      <!-- Bottom notebook -->
      <rect x="-70" y="-5" width="140" height="85" rx="4" fill="#2c3e50"/>
      <rect x="-65" y="0" width="130" height="75" rx="3" fill="#34495e"/>
      <line x1="-65" y1="20" x2="65" y2="20" stroke="#4a6a8a" stroke-width="1" opacity="0.5"/>
      <line x1="-65" y1="40" x2="65" y2="40" stroke="#4a6a8a" stroke-width="1" opacity="0.5"/>
      <line x1="-65" y1="60" x2="65" y2="60" stroke="#4a6a8a" stroke-width="1" opacity="0.5"/>
      
      <!-- Middle notebook (slightly offset) -->
      <rect x="-65" y="-35" width="130" height="75" rx="4" fill="#34495e"/>
      <rect x="-60" y="-30" width="120" height="65" rx="3" fill="#3d566e"/>
      <line x1="-60" y1="-10" x2="60" y2="-10" stroke="#5a7a9a" stroke-width="1" opacity="0.5"/>
      <line x1="-60" y1="10" x2="60" y2="10" stroke="#5a7a9a" stroke-width="1" opacity="0.5"/>
      <line x1="-60" y1="30" x2="60" y2="30" stroke="#5a7a9a" stroke-width="1" opacity="0.5"/>
      
      <!-- Top notebook -->
      <rect x="-60" y="-70" width="120" height="70" rx="4" fill="#3d566e"/>
      <rect x="-55" y="-65" width="110" height="60" rx="3" fill="#4a6a8a"/>
      <line x1="-55" y1="-45" x2="55" y2="-45" stroke="#6a8ab8" stroke-width="1" opacity="0.5"/>
      <line x1="-55" y1="-25" x2="55" y2="-25" stroke="#6a8ab8" stroke-width="1" opacity="0.5"/>
      <line x1="-55" y1="-5" x2="55" y2="-5" stroke="#6a8ab8" stroke-width="1" opacity="0.5"/>
    </g>
    
    <!-- Binding dots -->
    <g fill="#2c3e50" opacity="0.6">
      <circle cx="-55" cy="-30" r="2"/>
      <circle cx="-55" cy="-10" r="2"/>
      <circle cx="-55" cy="10" r="2"/>
      <circle cx="-55" cy="30" r="2"/>
      <circle cx="-55" cy="50" r="2"/>
    </g>
  </g>
  
  <text x="380" y="285" font-family="system-ui, sans-serif" font-size="10" fill="#aaa" text-anchor="end" opacity="0.3">Meridian</text>
</svg>
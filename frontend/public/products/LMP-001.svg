<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff8f0"/>
      <stop offset="100%" style="stop-color:#f0e8e0"/>
    </linearGradient>
    <filter id="shadow10" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg10)"/>
  
  <!-- Desk Lamp LED -->
  <g transform="translate(200, 150)" filter="url(#shadow10)">
    <!-- Base -->
    <ellipse cx="0" cy="60" rx="40" ry="8" fill="#2c2c2c"/>
    <ellipse cx="0" cy="58" rx="35" ry="6" fill="#1a1a1a"/>
    
    <!-- Stem -->
    <rect x="-6" y="-80" width="12" height="140" rx="3" fill="#2c2c2c"/>
    <rect x="-4" y="-78" width="8" height="136" rx="2" fill="#1a1a1a"/>
    
    <!-- Arm -->
    <rect x="-6" y="-110" width="12" height="30" rx="3" fill="#2c2c2c"/>
    <path d="M -6 -110 Q -40 -120 -40 -90" stroke="#2c2c2c" stroke-width="12" fill="none" stroke-linecap="round"/>
    
    <!-- Lamp head -->
    <ellipse cx="-40" cy="-100" rx="35" ry="18" fill="#1a1a1a"/>
    <ellipse cx="-40" cy="-100" rx="30" ry="14" fill="#0f0f0f"/>
    
    <!-- LED panel -->
    <ellipse cx="-40" cy="-100" rx="25" ry="10" fill="#FFAC1C" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="-40" cy="-100" rx="20" ry="8" fill="#FFAC1C" opacity="0.5"/>
    
    <!-- Brightness indicator -->
    <g fill="#FFAC1C" opacity="0.6">
      <rect x="-55" y="-95" width="6" height="4" rx="1"/>
      <rect x="-55" y="-89" width="6" height="4" rx="1"/>
      <rect x="-55" y="-83" width="6" height="4" rx="1"/>
    </g>
  </g>
  
  <text x="380" y="285" font-family="system-ui, sans-serif" font-size="10" fill="#aaa" text-anchor="end" opacity="0.3">Meridian</text>
</svg>
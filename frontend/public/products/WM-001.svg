<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8"/>
      <stop offset="100%" style="stop-color:#e0e8f0"/>
    </linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg3)"/>
  
  <!-- Wireless Mouse -->
  <g transform="translate(200, 150)" filter="url(#shadow3)">
    <!-- Mouse body -->
    <ellipse cx="0" cy="0" rx="70" ry="40" fill="#2c2c2c"/>
    <ellipse cx="0" cy="-5" rx="65" ry="35" fill="#1a1a1a"/>
    
    <!-- Top shell -->
    <ellipse cx="0" cy="-10" rx="55" ry="25" fill="#333"/>
    
    <!-- Scroll wheel -->
    <ellipse cx="0" cy="-15" rx="8" ry="5" fill="#444"/>
    <ellipse cx="0" cy="-15" rx="6" ry="3" fill="#666"/>
    
    <!-- LED light -->
    <circle cx="0" cy="5" r="4" fill="#FFAC1C" opacity="0.8">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Side buttons -->
    <ellipse cx="-55" cy="0" rx="8" ry="15" fill="#222"/>
    <ellipse cx="55" cy="0" rx="8" ry="15" fill="#222"/>
    
    <!-- Sensor -->
    <ellipse cx="0" cy="30" rx="6" ry="4" fill="#111"/>
  </g>
  
  <text x="380" y="285" font-family="system-ui, sans-serif" font-size="10" fill="#aaa" text-anchor="end" opacity="0.3">Meridian</text>
</svg>
<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg24" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f0f8"/>
      <stop offset="100%" style="stop-color:#e8e8f0"/>
    </linearGradient>
    <filter id="shadow25" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg24)"/>
  
  <!-- Noise Cancelling Headphones -->
  <g transform="translate(200, 150)" filter="url(#shadow25)">
    <!-- Headband -->
    <path d="M -80 30 Q -80 -50 0 -80 Q 80 -50 80 30" stroke="#1a1a1a" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M -75 25 Q -75 -45 0 -75 Q 75 -45 75 25" stroke="#0f0f0f" stroke-width="10" fill="none" stroke-linecap="round"/>
    
    <!-- Left earcup -->
    <g transform="translate(-80, 0)">
      <ellipse cx="0" cy="0" rx="50" ry="60" fill="#1a1a1a"/>
      <ellipse cx="0" cy="0" rx="45" ry="55" fill="#0f0f0f"/>
      <ellipse cx="0" cy="0" rx="40" ry="50" fill="#1a1a1a"/>
      <ellipse cx="0" cy="0" rx="35" ry="45" fill="#0f0f0f"/>
      
      <!-- ANC indicator -->
      <circle cx="-30" cy="-35" r="10" fill="#FFAC1C" opacity="0.8">
        <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="-30" y="-32" font-family="system-ui, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle" font-weight="bold">ANC</text>
      
      <!-- Controls -->
      <circle cx="35" cy="30" r="8" fill="#2a2a2a"/>
      <circle cx="35" cy="30" r="4" fill="#FFAC1C" opacity="0.8">
        <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <!-- Right earcup -->
    <g transform="translate(80, 0)">
      <ellipse cx="0" cy="0" rx="50" ry="60" fill="#1a1a1a"/>
      <ellipse cx="0" cy="0" rx="45" ry="55" fill="#0f0f0f"/>
      <ellipse cx="0" cy="0" rx="40" ry="50" fill="#1a1a1a"/>
      <ellipse cx="0" cy="0" rx="35" ry="45" fill="#0f0f0f"/>
      
      <!-- Controls -->
      <circle cx="-35" cy="30" r="8" fill="#2a2a2a"/>
      <circle cx="-35" cy="30" r="4" fill="#FFAC1C" opacity="0.8">
        <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
      </circle>
      
      <!-- Audio port -->
      <rect x="-8" y="-55" width="16" height="8" rx="2" fill="#1a1a1a"/>
      <rect x="-6" y="-53" width="12" height="4" rx="1" fill="#0f0f0f"/>
    </g>
    
    <!-- Headband padding -->
    <ellipse cx="0" cy="-75" rx="55" ry="8" fill="#1a1a1a" opacity="0.5"/>
    <ellipse cx="0" cy="-75" rx="50" ry="5" fill="#0f0f0f" opacity="0.5"/>
    
    <!-- Wireless indicator -->
    <text x="0" y="70" font-family="system-ui, sans-serif" font-size="9" fill="#FFAC1C" text-anchor="middle" font-weight="bold">Wireless • 40h • ANC</text>
  </g>
  
  <text x="380" y="285" font-family="system-ui, sans-serif" font-size="10" fill="#aaa" text-anchor="end" opacity="0.3">Meridian</text>
</svg>
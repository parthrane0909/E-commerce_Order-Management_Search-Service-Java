<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f8f0"/>
      <stop offset="100%" style="stop-color:#e0e8e0"/>
    </linearGradient>
    <filter id="shadow5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg5)"/>
  
  <!-- Standing Desk Converter -->
  <g transform="translate(200, 150)" filter="url(#shadow5)">
    <!-- Top surface -->
    <rect x="-100" y="-60" width="200" height="20" rx="4" fill="#2c3e2c"/>
    <rect x="-95" y="-58" width="190" height="16" rx="3" fill="#3a5a3a"/>
    
    <!-- Keyboard tray -->
    <rect x="-80" y="20" width="160" height="15" rx="3" fill="#3a5a3a"/>
    
    <!-- Gas spring columns -->
    <g fill="#2c2c2c">
      <rect x="-80" y="35" width="15" height="80" rx="3"/>
      <rect x="65" y="35" width="15" height="80" rx="3"/>
      <rect x="-60" y="35" width="10" height="80" rx="2"/>
      <rect x="50" y="35" width="10" height="80" rx="2"/>
    </g>
    
    <!-- Base feet -->
    <g fill="#2c2c2c">
      <ellipse cx="-85" cy="80" rx="15" ry="5"/>
      <ellipse cx="85" cy="80" rx="15" ry="5"/>
    </g>
    
    <!-- Handle -->
    <path d="M -60 -55 Q -60 -70 -30 -70 Q 0 -70 0 -55" stroke="#FFAC1C" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  
  <text x="380" y="285" font-family="system-ui, sans-serif" font-size="10" fill="#aaa" text-anchor="end" opacity="0.3">Meridian</text>
</svg>
<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f0f8"/>
      <stop offset="100%" style="stop-color:#f0e0f0"/>
    </linearGradient>
    <filter id="shadow6" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg6)"/>
  
  <!-- Wireless Earbuds -->
  <g transform="translate(200, 150)" filter="url(#shadow6)">
    <!-- Case -->
    <ellipse cx="0" cy="0" rx="50" ry="35" fill="#1a1a2e"/>
    <ellipse cx="0" cy="-5" rx="45" ry="30" fill="#0f0f1e"/>
    
    <!-- Earbuds -->
    <g fill="#1a1a2e">
      <!-- Left earbud -->
      <ellipse cx="-30" cy="5" rx="18" ry="12"/>
      <ellipse cx="-30" cy="5" rx="14" ry="8" fill="#0f0f1e"/>
      <circle cx="-30" cy="5" r="4" fill="#FFAC1C" opacity="0.6"/>
      
      <!-- Right earbud -->
      <ellipse cx="30" cy="5" rx="18" ry="12"/>
      <ellipse cx="30" cy="5" rx="14" ry="8" fill="#0f0f1e"/>
      <circle cx="30" cy="5" r="4" fill="#FFAC1C" opacity="0.6"/>
    </g>
    
    <!-- Case hinge -->
    <rect x="-5" y="-15" width="10" height="5" rx="2" fill="#2a2a3e"/>
    
    <!-- LED indicator -->
    <circle cx="0" cy="-25" r="3" fill="#FFAC1C" opacity="0.8">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Charging port hint -->
    <rect x="-8" cy="30" width="16" height="4" rx="2" fill="#2a2a3e"/>
  </g>
  
  <text x="380" y="285" font-family="system-ui, sans-serif" font-size="10" fill="#aaa" text-anchor="end" opacity="0.3">Meridian</text>
</svg>
<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f8ff"/>
      <stop offset="100%" style="stop-color:#e0e8f0"/>
    </linearGradient>
    <filter id="shadow8" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg8)"/>
  
  <!-- USB-C Hub -->
  <g transform="translate(200, 150)" filter="url(#shadow8)">
    <!-- Main body -->
    <rect x="-70" y="-30" width="140" height="50" rx="6" fill="#c0c0c0"/>
    <rect x="-65" y="-25" width="130" height="40" rx="4" fill="#a8a8a8"/>
    
    <!-- Ports -->
    <g fill="#333">
      <!-- USB-C upstream -->
      <rect x="-60" y="-20" width="18" height="8" rx="1"/>
      <rect x="-58" y="-18" width="14" height="4" rx="0.5" fill="#1a1a1a"/>
      
      <!-- HDMI -->
      <rect x="-35" y="-20" width="16" height="8" rx="1"/>
      <rect x="-33" y="-18" width="12" height="4" rx="0.5" fill="#1a1a1a"/>
      
      <!-- USB-A ports -->
      <rect x="-10" y="-20" width="14" height="8" rx="1"/>
      <rect x="10" y="-20" width="14" height="8" rx="1"/>
      <rect x="30" y="-20" width="14" height="8" rx="1"/>
      <g fill="#1a1a1a">
        <rect x="-8" y="-18" width="10" height="4" rx="0.5"/>
        <rect x="12" y="-18" width="10" height="4" rx="0.5"/>
        <rect x="32" y="-18" width="10" height="4" rx="0.5"/>
      </g>
      
      <!-- SD slots -->
      <rect x="55" y="-20" width="18" height="8" rx="1"/>
      <rect x="55" y="-8" width="18" height="8" rx="1"/>
      <g fill="#1a1a1a">
        <rect x="57" y="-18" width="14" height="4" rx="0.5"/>
        <rect x="57" y="-6" width="14" height="4" rx="0.5"/>
      </g>
    </g>
    
    <!-- PD indicator -->
    <text x="0" y="45" font-family="system-ui, sans-serif" font-size="9" fill="#FFAC1C" text-anchor="middle" font-weight="bold">100W PD</text>
    
    <!-- Cable -->
    <path d="M -70 0 Q -90 10 -90 25" stroke="#888" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  
  <text x="380" y="285" font-family="system-ui, sans-serif" font-size="10" fill="#aaa" text-anchor="end" opacity="0.3">Meridian</text>
</svg>
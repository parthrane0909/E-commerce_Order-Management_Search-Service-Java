<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg15" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f8f0"/>
      <stop offset="100%" style="stop-color:#e0e8e0"/>
    </linearGradient>
    <filter id="shadow15" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg15)"/>
  
  <!-- Thunderbolt 4 Cable -->
  <g transform="translate(200, 150)" filter="url(#shadow15)">
    <!-- Cable coil -->
    <g fill="none" stroke="#333" stroke-width="4" opacity="0.3">
      <path d="M -60 -20 Q -40 -40 -20 -20 Q 0 0 20 -20 Q 40 -40 60 -20"/>
    </g>
    
    <!-- Thunderbolt connectors -->
    <g>
      <!-- Left connector -->
      <rect x="-80" y="-12" width="25" height="14" rx="3" fill="#1a1a1a"/>
      <rect x="-78" y="-10" width="21" height="10" rx="2" fill="#0f0f0f"/>
      <circle cx="-67" cy="-5" r="3" fill="#FFAC1C" opacity="0.6">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
      </circle>
      
      <!-- Right connector -->
      <rect x="55" y="-12" width="25" height="14" rx="3" fill="#1a1a1a"/>
      <rect x="57" y="-10" width="21" height="10" rx="2" fill="#0f0f0f"/>
      <circle cx="68" cy="-5" r="3" fill="#FFAC1C" opacity="0.6">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <!-- Braided texture -->
    <path d="M -60 -20 Q -40 -40 -20 -20 Q 0 0 20 -20 Q 40 -40 60 -20" 
          stroke="#555" stroke-width="2" fill="none" stroke-dasharray="8,4" opacity="0.4"/>
    
    <!-- Specs label -->
    <text x="0" y="90" font-family="system-ui, sans-serif" font-size="10" fill="#666" text-anchor="middle">0.8m • 40Gbps • 100W</text>
  </g>
  
  <text x="380" y="285" font-family="system-ui, sans-serif" font-size="10" fill="#aaa" text-anchor="end" opacity="0.3">Meridian</text>
</svg>
<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f0f0"/>
      <stop offset="100%" style="stop-color:#f0e0e0"/>
    </linearGradient>
    <filter id="shadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg4)"/>
  
  <!-- Ergonomic Chair -->
  <g transform="translate(200, 150)" filter="url(#shadow4)">
    <!-- Backrest -->
    <rect x="-60" y="-80" width="120" height="160" rx="10" fill="#1a1a1a"/>
    <rect x="-55" y="-75" width="110" height="150" rx="8" fill="#111"/>
    
    <!-- Mesh pattern -->
    <g fill="#333" opacity="0.4">
      <rect x="-50" y="-70" width="100" height="140" rx="6" fill="none" stroke="#333" stroke-width="0.5"/>
      <g stroke="#333" stroke-width="0.3" opacity="0.3">
        <line x1="-50" y1="-60" x2="50" y2="-60"/>
        <line x1="-50" y1="-30" x2="50" y2="-30"/>
        <line x1="-50" y1="0" x2="50" y2="0"/>
        <line x1="-50" y1="30" x2="50" y2="30"/>
        <line x1="-50" y1="60" x2="50" y2="60"/>
      </g>
    </g>
    
    <!-- Headrest -->
    <ellipse cx="0" cy="-85" rx="35" ry="12" fill="#1a1a1a"/>
    <ellipse cx="0" cy="-85" rx="30" ry="8" fill="#111"/>
    
    <!-- Seat -->
    <rect x="-70" y="80" width="140" height="40" rx="8" fill="#1a1a1a"/>
    <rect x="-65" y="85" width="130" height="30" rx="6" fill="#111"/>
    
    <!-- Armrests -->
    <rect x="-90" y="60" width="25" height="60" rx="4" fill="#1a1a1a"/>
    <rect x="65" y="60" width="25" height="60" rx="4" fill="#1a1a1a"/>
    
    <!-- Base -->
    <ellipse cx="0" cy="130" rx="50" ry="8" fill="#1a1a1a"/>
    <ellipse cx="0" cy="130" rx="45" ry="6" fill="#111"/>
    
    <!-- Wheels -->
    <g fill="#333">
      <ellipse cx="-40" cy="135" rx="10" ry="6"/>
      <ellipse cx="40" cy="135" rx="10" ry="6"/>
      <ellipse cx="-20" cy="135" rx="10" ry="6"/>
      <ellipse cx="20" cy="135" rx="10" ry="6"/>
    </g>
  </g>
  
  <text x="380" y="285" font-family="system-ui, sans-serif" font-size="10" fill="#aaa" text-anchor="end" opacity="0.3">Meridian</text>
</svg>
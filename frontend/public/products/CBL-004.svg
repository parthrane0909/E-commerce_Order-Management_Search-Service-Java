<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg16" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f0f8"/>
      <stop offset="100%" style="stop-color:#e0e0f0"/>
    </linearGradient>
    <filter id="shadow16" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg16)"/>
  
  <!-- Ethernet Cat6 Cable -->
  <g transform="translate(200, 150)" filter="url(#shadow16)">
    <!-- Cable coil -->
    <g fill="none" stroke="#333" stroke-width="4" opacity="0.3">
      <path d="M -60 -20 Q -40 -40 -20 -20 Q 0 0 20 -20 Q 40 -40 60 -20"/>
    </g>
    
    <!-- RJ45 connectors -->
    <g>
      <!-- Left connector -->
      <rect x="-80" y="-14" width="30" height="16" rx="3" fill="#1a1a1a"/>
      <rect x="-78" y="-12" width="26" height="12" rx="2" fill="#0f0f0f"/>
      <rect x="-75" y="-8" width="20" height="4" rx="1" fill="#333"/>
      <rect x="-70" y="-14" width="10" height="14" rx="2" fill="#333"/>
      
      <!-- Right connector -->
      <rect x="50" y="-14" width="30" height="16" rx="3" fill="#1a1a1a"/>
      <rect x="52" y="-12" width="26" height="12" rx="2" fill="#0f0f0f"/>
      <rect x="55" y="-8" width="20" height="4" rx="1" fill="#333"/>
      <rect x="62" y="-14" width="10" height="14" rx="2" fill="#333"/>
    </g>
    
    <!-- Cable texture -->
    <path d="M -60 -20 Q -40 -40 -20 -20 Q 0 0 20 -20 Q 40 -40 60 -20" 
          stroke="#555" stroke-width="2" fill="none" stroke-dasharray="8,4" opacity="0.4"/>
    
    <!-- Specs label -->
    <text x="0" y="90" font-family="system-ui, sans-serif" font-size="10" fill="#666" text-anchor="middle">5m • Cat6 • 1Gbps</text>
  </g>
  
  <text x="380" y="285" font-family="system-ui, sans-serif" font-size="10" fill="#aaa" text-anchor="end" opacity="0.3">Meridian</text>
</svg>
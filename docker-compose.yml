# =====================================================================
# E-Commerce Order Management & Search Service
#
# Polyglot persistence demo:
#   MongoDB (catalog)  +  PostgreSQL (source of truth for orders)
#   PostgreSQL -> RabbitMQ -> Java Worker -> Elasticsearch (search/analytics)
#
# Usage:
#   cp .env.example .env
#   docker compose up -d --build
# =====================================================================
name: ecommerce-orders

x-backend-environment: &backend-environment
  # In-network service endpoints (override the localhost defaults from .env)
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  MONGO_URI: mongodb://mongodb:27017
  SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017
  ELASTICSEARCH_URL: http://elasticsearch:9200
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-ecommerce}:${RABBITMQ_DEFAULT_PASSWORD:-change_me_rabbit}@rabbitmq:5672/
  SERVER_PORT: 8000
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  ENVIRONMENT: ${ENVIRONMENT:-development}

services:
  # ------------------------------------------------------------------
  # Infrastructure
  # ------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecommerce} -d ${POSTGRES_DB:-ecommerce}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [app_net]

  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [app_net]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      ES_JAVA_OPTS: "${ES_JAVA_OPTS:--Xms512m -Xmx512m}"
      cluster.routing.allocation.disk.watermark.low: 95%
      cluster.routing.allocation.disk.watermark.high: 98%
      cluster.routing.allocation.disk.watermark.flood_stage: 98%
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks: [app_net]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-ecommerce}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASSWORD:-change_me_rabbit}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s
    networks: [app_net]

  # ------------------------------------------------------------------
  # Application
  # ------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *backend-environment
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks: [app_net]

  java-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *backend-environment
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 25s
    networks: [app_net]

  frontend:
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_PROXY_TARGET: http://backend:8000
    command: npm run dev -- --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks: [app_net]

  # ------------------------------------------------------------------
  # Production-style static frontend (nginx).  Opt-in:  --profile prod
  #   docker compose --profile prod up -d --build frontend-prod
  #   → http://localhost:8080
  # ------------------------------------------------------------------
  frontend-prod:
    build:
      context: ./frontend
      target: prod
    restart: unless-stopped
    profiles: ["prod"]
    ports:
      - "${WEB_PORT:-8080}:80"
    networks: [app_net]
    depends_on:
      backend:
        condition: service_healthy

  # ------------------------------------------------------------------
  # One-shot helpers:  docker compose run --rm seed / reindex
  # ------------------------------------------------------------------
  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      MONGO_URI: mongodb://mongodb:27017
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017
      ELASTICSEARCH_URL: http://elasticsearch:9200
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-ecommerce}
      RABBITMQ_DEFAULT_PASSWORD: ${RABBITMQ_DEFAULT_PASSWORD:-change_me_rabbit}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-ecommerce}:${RABBITMQ_DEFAULT_PASSWORD:-change_me_rabbit}@rabbitmq:5672/
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    profiles: ["tools"]
    command: java -jar app.jar --spring.profiles.active=seed
    networks: [app_net]
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  reindex:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      <<: *backend-environment
    profiles: ["tools"]
    command: java -jar app.jar --spring.profiles.active=reindex
    networks: [app_net]
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  # ------------------------------------------------------------------
  # One-shot catalog seeder: ~3000 diverse products straight into MongoDB.
  #   docker compose build seed
  #   docker compose --profile tools run --rm catalog-seed
  # Idempotent (tops up to CATALOG_PRODUCT_COUNT), additive to the demo products,
  # and exits 0 on success / 1 on failure. Opt-in destructive rebuild:
  #   CATALOG_RESET=true docker compose --profile tools run --rm catalog-seed
  # ------------------------------------------------------------------
  catalog-seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      MONGO_URI: mongodb://mongodb:27017
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017
      ELASTICSEARCH_URL: http://elasticsearch:9200
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-ecommerce}
      RABBITMQ_DEFAULT_PASSWORD: ${RABBITMQ_DEFAULT_PASSWORD:-change_me_rabbit}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-ecommerce}:${RABBITMQ_DEFAULT_PASSWORD:-change_me_rabbit}@rabbitmq:5672/
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CATALOG_PRODUCT_COUNT: ${CATALOG_PRODUCT_COUNT:-3000}
      CATALOG_RESET: ${CATALOG_RESET:-false}
    profiles: ["tools"]
    command: java -jar app.jar --spring.profiles.active=catalog
    networks: [app_net]
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

networks:
  app_net:
    driver: bridge

volumes:
  postgres_data:
  mongodb_data:
  elasticsearch_data:
  rabbitmq_data:
  frontend_node_modules:
  uploads_data:
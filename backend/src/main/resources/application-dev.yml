# Development Profile Overrides
spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  
  data:
    mongodb:
      auto-index-creation: true

logging:
  level:
    com.meridian.backend: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Disable actuator security in dev
management:
  endpoint:
    health:
      show-details: always